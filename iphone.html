<!DOCTYPE html><html><head><meta charset="utf-8"><title>iPhone preview</title>
<style>
  body { background:#1b1c21; margin:0; height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .wrap { transform-origin: center center; }
  .phone { width:390px; height:844px; border-radius:54px; border:11px solid #000; position:relative; overflow:hidden;
    background:#000; box-shadow: 0 0 0 2px #2c2d33, 0 30px 80px rgba(0,0,0,0.7); }
  .island { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:34px;
    background:#000; border-radius:18px; z-index:10; }
  iframe { width:390px; height:844px; border:none; display:block; }
</style></head><body>
  <div class="wrap" id="wrap">
    <div class="phone"><div class="island"></div><iframe src="index.html"></iframe></div>
  </div>
  <script>
    function fit(){
      const s = Math.min(1, (innerHeight-24)/866, (innerWidth-24)/412);
      document.getElementById('wrap').style.transform = 'scale('+s+')';
    }
    fit(); addEventListener('resize', fit);
  </script>
</body></html>
