<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <title>Tarot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 16px 80px;
    }

    /* ── Spread ────────────────────────────────────────────────── */
    .spread {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 480px;
    }

    .slot {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 16px;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding-top: 0;
      flex: 1;
      min-width: 0;
      height: 275px;
      overflow: hidden;
    }

    /* ── Card shell ─────────────────────────────────────────────── */
    .card-wrap {
      width: 160px;
      height: 275px;
      perspective: 1000px;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    /* Lenormand cards are narrower in ratio; adjust height */
    .lenormand-mode .card-wrap {
      height: 240px;
    }
    .lenormand-mode .card-info {
      height: 240px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-inner.flipped { transform: rotateY(180deg); }

    .card-back, .card-front {
      position: absolute;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      border-radius: 7px;
      overflow: hidden;
    }

    /* RWS card back — actual deck image */
    .card-back {
      background: url('card-back.jpg') center / cover no-repeat;
    }

    /* Tarot face */
    .card-front {
      transform: rotateY(180deg);
      background: #111;
    }
    .card-front img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .card-front.rev img { transform: rotate(180deg); }

    /* Lenormand face — CSS sprite from SVG */
    .card-front.lenormand {
      transform: rotateY(180deg);
      background: url('russian-deck.svg') no-repeat;
      /* size and position set inline per card */
    }

    /* ── Card label (Lenormand name) ────────────────────────────── */
    .card-label {
      color: #eee;
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
      font-size: 1.05rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: left;
      min-height: 0;
    }

    /* ── Card meaning (tap to reveal) ──────────────────────────── */
    .meaning-text {
      color: #ddd;
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
      font-size: 1rem;
      line-height: 1.6;
      text-align: left;
      white-space: pre-line;
      display: none;
    }
    .meaning-text.visible { display: block; }

    /* ── Controls ───────────────────────────────────────────────── */
    .controls {
      position: fixed;
      bottom: 24px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }

.btn-settings {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 13px;
      line-height: 0;
    }
    .btn-settings svg { width: 20px; height: 20px; fill: #555; transition: fill 0.2s; }
    .btn-settings:hover svg { fill: #888; }
    .btn-settings.active svg { fill: #ddd; }

    /* Settings panel */
    .settings-panel {
      position: fixed;
      bottom: 80px;
      right: 20px;
      display: none;
      flex-direction: column;
      gap: 20px;
      padding: 20px 24px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      min-width: 220px;
      z-index: 100;
    }
    .settings-panel.open { display: flex; }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .setting-label {
      color: #ccc;
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    /* Toggle */
    .toggle-wrap { display: flex; align-items: center; cursor: pointer; }
    .toggle-wrap input { display: none; }
    .toggle-track {
      width: 36px; height: 20px; background: #333;
      border-radius: 10px; position: relative; transition: background 0.2s; flex-shrink: 0;
    }
    .toggle-thumb {
      position: absolute; top: 4px; left: 4px;
      width: 12px; height: 12px; background: #fff;
      border-radius: 50%; transition: transform 0.2s;
    }
    .toggle-wrap input:checked + .toggle-track { background: #4a7fc1; }
    .toggle-wrap input:checked + .toggle-track .toggle-thumb { transform: translateX(16px); }

    /* Deck picker */
    .deck-picker { display: flex; gap: 4px; }
    .deck-btn {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #666;
      font-family: 'Palatino Linotype', Palatino, serif;
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 9px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .deck-btn.active { background: #2a2a2a; color: #ddd; border-color: #555; }
    .deck-btn:hover:not(.active) { color: #aaa; border-color: #444; }

    /* Hide reversed row in Lenormand mode */
    .lenormand-mode .rev-toggle { display: none; }

    /* Lenormand card back — SVG sprite at col 13 (card back column) */
    .lenormand-mode .card-back {
      background: url('russian-deck.svg') -2273px -14px / 2447px 1030px no-repeat;
      box-shadow: none;
    }

    /* Tighter corners to match the SVG card's own rounding (rx≈30px → ~13.5px at display scale) */
    .lenormand-mode .card-back,
    .lenormand-mode .card-front.lenormand {
      border-radius: 14px;
    }
  </style>
</head>
<body>

  </div>

      </div>

    <div class="card-info">
      <div class="card-label" id="lbl2"></div>
      <div class="meaning-text" id="mn2"></div>
    </div>
  </div>
</div>

<div class="settings-panel" id="settingsPanel">
  <!-- Reversed toggle (Tarot only) -->
  <div class="setting-row rev-toggle">
    <span class="setting-label">Reversed</span>
    <label class="toggle-wrap">
      <input type="checkbox" id="revToggle">
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
    </label>
  </div>
  <!-- Deck picker -->
  <div class="setting-row">
    <div class="deck-picker">

</div>

<div class="controls" id="controls">

</div>

// SVG sprite constants
const SVG_CARD_W = 359, SVG_CARD_H = 539;
const SVG_TOTAL_W = 5490, SVG_TOTAL_H = 2310;
const DISPLAY_W = 160;
const SCALE = DISPLAY_W / SVG_CARD_W;           // 0.4457
const BG_W = Math.round(SVG_TOTAL_W * SCALE);   // 2447
const BG_H = Math.round(SVG_TOTAL_H * SCALE);   // 1030

// Column x-positions in the SVG
const COL_X = [30.5,420.5,810.5,1200.5,1590.5,1980.5,2370.5,2760.5,3150.5,3540.5,3930.5,4320.5,4710.5,5100.5];
// Row y-positions: ♥ ♦ ♣ ♠
const ROW_Y = [30.5, 600.5, 1170.5, 1740.5];
// Rank → column index (A=0, 2=1..5=4, 6=5..K=12, back=13)
const RANK_COL = { A:0, 6:5, 7:6, 8:7, 9:8, 10:9, J:10, Q:11, K:12 };
// Suit → row index
const SUIT_ROW = { '♥':0, '♦':1, '♣':2, '♠':3 };

function spriteStyle(suit, rank) {
  const col = RANK_COL[rank];
  const row = SUIT_ROW[suit];
  const bx = -Math.round(COL_X[col] * SCALE);
  const by = -Math.round(ROW_Y[row] * SCALE);
  return `background:url('russian-deck.svg') ${bx}px ${by}px / ${BG_W}px ${BG_H}px`;
}

function draw() {
  meaningsVisible = false;
  closeSettings();
  for (let i = 0; i < 3; i++) {
    document.getElementById(`ci${i}`).classList.remove('flipped');
    document.getElementById(`lbl${i}`).textContent = '';
    const mn = document.getElementById(`mn${i}`);
    mn.textContent = '';
    mn.classList.remove('visible');
    flipped[i] = false;
  }
  if (currentDeck === 'lenormand') drawLenormand();
  else if (currentDeck === 'marseille') drawMarseille();
  else drawTarot();
}

function drawTarot() {
  const allowRev = !document.getElementById('revToggle').checked;
  const shuffled = [...TAROT].sort(() => Math.random() - 0.5).slice(0, 3);
  shuffled.forEach((img, i) => {
    const front = document.getElementById(`cf${i}`);
    front.className = 'card-front';
    front.style.cssText = '';
    const el = document.getElementById(`img${i}`);
    el.style.display = '';
    el.src = WIKI + img;
    front.innerHTML = '';
    front.appendChild(el);
    front.dataset.key = img.replace('.jpg', '');
    const rev = !allowRev && Math.random() < 0.3;
    if (rev) front.classList.add('rev');
  });
  setTimeout(() => flip(0), 300);
  setTimeout(() => flip(1), 550);
  setTimeout(() => flip(2), 800);
}

function drawMarseille() {
  const allowRev = !document.getElementById('revToggle').checked;
  const shuffled = [...TAROT].sort(() => Math.random() - 0.5).slice(0, 3);
  shuffled.forEach((img, i) => {
    const key = img.replace('.jpg', '');
    const front = document.getElementById(`cf${i}`);

    front.style.cssText = '';

    front.innerHTML = '';

  });
  setTimeout(() => flip(0), 300);
  setTimeout(() => flip(1), 550);
  setTimeout(() => flip(2), 800);
}

function drawLenormand() {
  const shuffled = [...LENORMAND].sort(() => Math.random() - 0.5).slice(0, 3);
  drawnLenormand = shuffled;
  shuffled.forEach((card, i) => {
    const front = document.getElementById(`cf${i}`);
    front.className = 'card-front lenormand';
    front.style.cssText = spriteStyle(card.suit, card.rank);
    front.innerHTML = '';           // no <img> needed
    front.dataset.name = card.name;
    front.dataset.suit = card.suit;
    front.dataset.rank = card.rank;
  });
  setTimeout(() => flip(0, true), 300);
  setTimeout(() => flip(1, true), 550);
  setTimeout(() => flip(2, true), 800);
}

// ── Flip ───────────────────────────────────────────────────────────────────
function flip(i, showLabel) {
  document.getElementById(`ci${i}`).classList.add('flipped');
  flipped[i] = true;
  if (showLabel) {
    setTimeout(() => {
      const front = document.getElementById(`cf${i}`);
      const name = front.dataset.name || '';
      const icon = LEN_ICON[name] || '';
      document.getElementById(`lbl${i}`).textContent = icon ? `${icon} ${name}` : name;
    }, 360);
  }
}

function lenMeaning(i) {
  if (!drawnLenormand[i]) return '';
  const name = drawnLenormand[i].name;
  const d = LENDATA[name];
  if (!d) return name;
  let text = d[0];
  const sep = '\n\n───────────\n';
  if (i === 0 && drawnLenormand[1]) {
    const nb = drawnLenormand[1].name;
    const db = LENDATA[nb];
    if (db) text += `${sep}${name} + ${nb}\n${d[1]} ${db[2]}`;
  } else if (i === 2 && drawnLenormand[1]) {
    const na = drawnLenormand[1].name;
    const da = LENDATA[na];
    if (da) text += `${sep}${na} + ${name}\n${da[1]} ${d[2]}`;
  } else if (i === 1 && drawnLenormand[0] && drawnLenormand[2]) {
    const na = drawnLenormand[0].name;
    const nc = drawnLenormand[2].name;
    const da = LENDATA[na];
    const dc = LENDATA[nc];
    if (da && dc) {
      text += `${sep}${na} · ${name} · ${nc}\n${da[1]} → ${d[1]} → ${dc[1]}`;
    }
  }
  return text;
}

function tap(i) {
  const now = Date.now();
  const gap = now - lastTap;
  lastTap = now;

  if (gap < 300 && gap > 0) {
    clearTimeout(tapTimer);
    draw();
    return;
  }

  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => {
    if (!flipped[i]) {
      flip(i, currentDeck === 'lenormand');
      return;
    }
    toggleAllMeanings();
  }, 300);
}

function getMeaning(i) {
  const front = document.getElementById(`cf${i}`);
  const key = front.dataset.key;
  const upright = MEANINGS[key] || '';
  if (!front.classList.contains('rev') || !REVERSED[key]) return upright;
  const header = upright.split('\n')[0] + ' (Rev.)';
  return header + '\n' + REVERSED[key];
}

function toggleAllMeanings() {
  meaningsVisible = !meaningsVisible;
  for (let i = 0; i < 3; i++) {
    const mn = document.getElementById(`mn${i}`);
    if (meaningsVisible && flipped[i]) {
      const text = currentDeck === 'lenormand' ? lenMeaning(i) : getMeaning(i);
      if (text) { mn.textContent = text; mn.classList.add('visible'); }
    } else {
      mn.classList.remove('visible');
      mn.textContent = '';
    }
  }
}

// ── Settings ───────────────────────────────────────────────────────────────
function closeSettings() {
  document.getElementById('settingsPanel').classList.remove('open');
  document.getElementById('btnSettings').classList.remove('active');
}
function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
  document.getElementById('btnSettings').classList.toggle('active');
}

// ── Deck switch ────────────────────────────────────────────────────────────
function switchDeck(deck) {
  currentDeck = deck;
  const isLen = deck === 'lenormand';
  document.body.classList.toggle('lenormand-mode', isLen);

  ['tarot', 'marseille', 'lenormand'].forEach(d => {
    const btn = document.getElementById('btn' + d.charAt(0).toUpperCase() + d.slice(1));
    if (btn) btn.classList.toggle('active', d === deck);
  });

  for (let i = 0; i < 3; i++) {
    const front = document.getElementById(`cf${i}`);
    if (!isLen && !document.getElementById(`img${i}`)) {
      const img = document.createElement('img');
      img.id = `img${i}`; img.src = ''; img.alt = '';
      front.appendChild(img);
    }
  }
  draw();
}

// ── Init ───────────────────────────────────────────────────────────────────
document.addEventListener('click', (e) => {
  const panel = document.getElementById('settingsPanel');
  const btn = document.getElementById('btnSettings');
  if (panel.classList.contains('open') &&
      !panel.contains(e.target) && !btn.contains(e.target)) {
    closeSettings();
  }
});

draw();
</script>
