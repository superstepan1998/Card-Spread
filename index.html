<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0a10">
  <title>Tarot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    /* liquid-glass ambience: two soft color glows behind everything */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }
    body::before {
      width: 420px; height: 420px; left: -120px; top: 4%;
      background: radial-gradient(circle, rgba(118,88,210,0.20), transparent 62%);
    }
    body::after {
      width: 360px; height: 360px; right: -100px; top: 46%;
      background: radial-gradient(circle, rgba(205,145,75,0.16), transparent 62%);
    }

    body {
      background: radial-gradient(ellipse 120% 80% at 50% 18%, #141020 0%, #0b0a10 55%, #070609 100%) fixed #0b0a10;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(48px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    }

    /* ── Spread ────────────────────────────────────────────────── */
    .spread {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 480px;
    }

    .slot {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 16px;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding-top: 0;
      flex: 1;
      min-width: 0;
      height: 275px;
      overflow: hidden;
    }

    /* ── Card shell ─────────────────────────────────────────────── */
    .card-wrap {
      width: 160px;
      height: 275px;
      perspective: 1000px;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      transition: filter 0.15s;
    }
    .card-wrap:active { filter: brightness(1.18); }   /* tactile press feedback */


    /* Lenormand cards are narrower in ratio; adjust height */
    .lenormand-mode .card-wrap {
      height: 240px;
    }
    .lenormand-mode .card-info {
      height: 240px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-inner.flipped { transform: rotateY(180deg); }

    .card-back, .card-front, .card-back *, .card-front * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
    }
    .card-back, .card-front {
      position: absolute;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      border-radius: 7px;
      overflow: hidden;
    }

    /* RWS card back — actual deck image */
    .card-back {
      background: url('card-back.jpg') center / cover no-repeat;
    }

    /* Tarot face */
    .card-front {
      transform: rotateY(180deg);
      background: #111;
    }
    .card-front img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    /* Fallback shown when a remote card image fails to load */
    .card-fallback {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px;
      background: #f4f1e8; color: #222;
      font-family: 'Palatino Linotype', Palatino, serif;
      border-radius: 7px;
    }
    .card-fallback .fb-rank { font-size: 2.4rem; font-weight: bold; line-height: 1; }
    .card-fallback .fb-suit { font-size: 2.8rem; line-height: 1; }
    .card-fallback.red { color: #b01020; }
    /* Marseille images are 813×1536 (ratio 0.529); shrink wrap to avoid height crop,
       then scale 5% to push white image border outside the overflow:hidden clip */
    .marseille-mode .card-wrap { width: 146px; }
    .marseille-mode .card-front img { transform: scale(1.05); }
    .marseille-mode .card-back {
      background: url('marseille-back.png') center / cover no-repeat;
    }
    .card-front.rev img { transform: rotate(180deg); }

    /* Lenormand face — CSS sprite from SVG */
    .card-front.lenormand {
      transform: rotateY(180deg);
      background: url('russian-deck.svg') no-repeat;
      /* size and position set inline per card */
    }

    /* ── Card label (Lenormand name) ────────────────────────────── */
    .card-label {
      color: #e8ddc8;
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
      font-size: 1.22rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: left;
      min-height: 0;
      word-spacing: 4px;   /* breathing room after the emoji */
    }

    /* ── Card meaning (tap to reveal) ──────────────────────────── */
    .meaning-text {
      color: #c6c0b4;
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
      font-size: 0.84rem;
      line-height: 1.55;
      max-width: 46ch;
      text-align: left;
      white-space: pre-line;
      display: none;
    }
    .meaning-text.visible { display: block; }

    /* ── Controls ───────────────────────────────────────────────── */
    .controls {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      right: calc(20px + env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }

.btn-settings {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 13px;
      line-height: 0;
    }
    .btn-settings svg { width: 22px; height: 22px; fill: #8a8578; transition: fill 0.2s; }
    .btn-settings:hover svg { fill: #888; }
    .btn-settings.active svg { fill: #ddd; }

    /* Settings panel */
    .settings-panel {
      transform: translateZ(0); /* own compositing layer above 3D card layers */
      position: fixed;
      bottom: calc(80px + env(safe-area-inset-bottom));
      right: calc(20px + env(safe-area-inset-right));
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 20px 24px;
      overflow: hidden;
      background: rgba(255,255,255,0.07);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
      backdrop-filter: blur(26px) saturate(150%);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 18px 50px rgba(0,0,0,0.5);
      min-width: 260px;
      max-width: calc(100vw - 40px);
      max-height: 78vh;
      z-index: 100;
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .settings-panel { background: rgba(24,26,34,0.97); }
      .deck-gallery { background: rgb(12,13,20); }
    }
    .sheet-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .sheet-handle {
      display: none;           /* visible on phones only */
      justify-content: center;
      padding: 4px 0 10px;
      flex-shrink: 0;
      touch-action: none;
      cursor: grab;
    }
    .sheet-handle::after {
      content: '';
      width: 46px; height: 5px;
      border-radius: 3px;
      background: rgba(255,255,255,0.3);
    }
    /* Quiet divider between settings sections */
    .set-div {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 2px 0;
    }
    .settings-panel.open { display: flex; }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .setting-label {
      color: #ccc;
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    /* Toggle */
    .toggle-wrap { display: flex; align-items: center; cursor: pointer; }
    .toggle-wrap input { display: none; }
    .toggle-track {
      width: 50px; height: 30px; background: #333;
      border-radius: 15px; position: relative; transition: background 0.2s; flex-shrink: 0;
    }
    .toggle-thumb {
      position: absolute; top: 4px; left: 4px;
      width: 22px; height: 22px; background: #fff;
      border-radius: 50%; transition: transform 0.2s;
    }
    .toggle-wrap input:checked + .toggle-track { background: #4a7fc1; }
    .toggle-wrap input:checked + .toggle-track .toggle-thumb { transform: translateX(20px); }

    /* Deck picker */
    .deck-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; }
    /* odd last deck button spans the full row, centered */
    .deck-btn {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #666;
      font-family: 'Palatino Linotype', Palatino, serif;
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 7px 9px;
      cursor: pointer;
      transition: all 0.2s;
      opacity: 0.62;               /* inactive decks recede… */
    }
    .deck-btn.active {
      opacity: 1;                  /* …the active deck pops */
      box-shadow: 0 0 12px -3px currentColor;
    }
    .deck-btn:hover { opacity: 0.85; }
    .deck-btn:active, .count-btn:active, .reshuffle-btn:active { transform: scale(0.965); }
    .list-tab:active { opacity: 0.65; }
    .deck-btn.active { background: #2a2a2a; color: #ddd; border-color: #555; }
    .deck-btn:hover:not(.active) { color: #aaa; border-color: #444; }
    /* Lenormand white */
    /* Атласные — dirty green */
    #btnLenormand { background: #232a18; border-color: #5a6b3a; color: #a8b884; }
    #btnLenormand.active { background: #313a22; border-color: #7e9456; color: #c6d6a0; }
    #btnLenormand:hover:not(.active) { background: #2a321e; border-color: #6c8048; color: #b8c892; }
    /* Tarot bright yellow */
    #btnTarot { background: #4a3a00; border-color: #d4af1a; color: #ffd633; }
    #btnTarot.active { background: #6a5400; border-color: #ffd633; color: #fff066; }
    #btnTarot:hover:not(.active) { background: #574500; border-color: #e6c020; color: #ffe04d; }
    /* Marseille orange */
    #btnMarseille { background: #5a2800; border-color: #e87810; color: #ff9c40; }
    #btnMarseille.active { background: #7a3800; border-color: #ff9020; color: #ffb860; }
    #btnMarseille:hover:not(.active) { background: #663000; border-color: #f48818; color: #ffa850; }
    /* Bicycle bright blue */
    #btnBicycle { background: #0a3a8a; border-color: #2a7aff; color: #99ccff; }
    #btnBicycle.active { background: #1050d0; border-color: #4d9aff; color: #ffffff; }
    #btnBicycle:hover:not(.active) { background: #0d44a8; border-color: #3a8aff; color: #cce6ff; }
    /* Bicycle JUMBO bright red */
    #btnRed { background: #a01010; border-color: #ff3a3a; color: #ffcccc; }
    #btnRed.active { background: #d01818; border-color: #ff5a5a; color: #ffffff; }
    #btnRed:hover:not(.active) { background: #b81414; border-color: #ff4a4a; color: #ffe0e0; }
    /* Golden dark red */
    #btnGolden { background: #3a0808; border-color: #7a1414; color: #c86060; }
    #btnGolden.active { background: #5a0c0c; border-color: #a01c1c; color: #e89090; }
    #btnGolden:hover:not(.active) { background: #4a0a0a; border-color: #8a1818; color: #d87878; }
    /* Copag 4 Colour — teal */
    #btnCopag { background: #0a3a34; border-color: #2a9a86; color: #7fd6c2; }
    #btnCopag.active { background: #0f5248; border-color: #3fc0a8; color: #b2f0de; }
    #btnCopag:hover:not(.active) { background: #0c463e; border-color: #34ad96; color: #98e2d0; }
    #btnTarot { grid-column: 1 / -1; }
    /* Modiano — violet */
    #btnMadyana { background: #241335; border-color: #7a4fc0; color: #b895e8; }
    #btnMadyana.active { background: #341c4e; border-color: #9a6ae0; color: #d4bcf8; }
    #btnMadyana:hover:not(.active) { background: #2c1740; border-color: #8a5cd0; color: #c6a8f0; }
    /* Russian beige */
    #btnRussian { background: #4a3f2c; border-color: #c8b088; color: #ecd9b4; }
    #btnRussian.active { background: #5e503a; border-color: #e6caa0; color: #f8ecd0; }
    #btnRussian:hover:not(.active) { background: #544733; border-color: #d8be94; color: #f2e2c2; }

    /* Card count picker */
    .count-picker { display: flex; gap: 4px; }
    .count-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
      color: #8b8778; font-family: 'Palatino Linotype', Palatino, serif;
      font-size: 0.78rem; letter-spacing: 1px; padding: 4px 16px;
      cursor: pointer; transition: all 0.2s;
    }
    .count-btn.active { background: rgba(255,255,255,0.16); color: #f0ead8; border-color: rgba(255,255,255,0.28); }
    .count-btn:hover:not(.active) { color: #aaa; border-color: #444; }
    /* One-card mode: hide other slots and center the single card on screen */
    .one-card #slot1, .one-card #slot2 { display: none; }
    body.one-card { justify-content: center; }
    .one-card .spread { align-items: center; }
    .one-card .slot { flex-direction: column; align-items: center; gap: 14px; }
    .one-card .card-info {
      height: auto;
      align-items: center;
      text-align: center;
      max-height: 34vh;
      overflow-y: auto;
    }
    .one-card .card-label,
    .one-card .meaning-text { text-align: center; }

    /* Reshuffle row */
    .reshuffle-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .reshuffle-btn {
      background: rgba(220,70,70,0.14);
      border: 1px solid rgba(255,110,110,0.40);
      border-radius: 14px;
      color: #ffb0b0;
      font-family: 'Palatino Linotype', Palatino, serif;
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 9px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      text-align: center;
    }
    .reshuffle-btn:hover { color: #ffd0d0; border-color: rgba(255,140,140,0.6); background: rgba(220,70,70,0.22); }
    /* Save reading — light green */
    .save-btn { background: rgba(110,190,110,0.16); border-color: rgba(150,220,150,0.42); color: #cfeec4; }
    .save-btn:hover { background: rgba(110,190,110,0.24); border-color: rgba(170,235,170,0.6); color: #e4ffd9; }
    .deck-count {
      color: #444;
      font-family: 'Palatino Linotype', Palatino, serif;
      font-size: 0.68rem;
      letter-spacing: 1px;
      text-align: center;
    }

    /* Hide reversed row in Lenormand mode */
    .lenormand-mode .rev-toggle, .copag-mode .rev-toggle, .madyana-mode .rev-toggle { display: none; }

    /* ── History ──────────────────────────────────────────────────── */
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .history-clear-btn {
      background: none;
      border: none;
      color: #55503f;
      font-size: 0.65rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      padding: 8px 6px;
      margin: -6px -6px -6px 0;
      font-family: 'Palatino Linotype', Palatino, serif;
      transition: color 0.2s;
    }
    .history-clear-btn:hover { color: #888; }
    /* Swipe-to-delete rows (iOS style) */
    .swipe-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      flex-shrink: 0;   /* overflow:hidden zeroes the flex min-size — don't let rows collapse */
    }
    .swipe-del {
      opacity: 0;
      transition: opacity 0.15s;
      position: absolute; top: 0; right: 0; bottom: 0;
      width: 88px;
      border: none;
      background: rgba(215,60,55,0.9);
      color: #fff;
      font-family: 'Palatino Linotype', Palatino, serif;
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .swipe-wrap.reveal .swipe-del { opacity: 1; }
    .swipe-wrap .history-entry {
      position: relative;
      z-index: 1;
      touch-action: pan-y;
      will-change: transform;
    }
    /* Saved / History tab switcher */
    .list-tabs-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .list-tabs {
      flex: 1;
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 13px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
    }
    .list-tab {
      flex: 1;
      background: none; border: none;
      color: #8b8778;
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
      font-size: 0.95rem;
      padding: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .list-tab.active {
      color: #f0ead8;
      background: rgba(255,255,255,0.14);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    /* ── Saved readings ─────────────────────────────────────────────── */
    .saved-name {
      color: #eccf86;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      font-family: 'Palatino Linotype', Palatino, serif;
    }
    .saved-del {
      background: none; border: none;
      color: #444;
      font-size: 0.62rem; letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; padding: 2px 0;
      font-family: 'Palatino Linotype', Palatino, serif;
      transition: color 0.2s;
    }
    .saved-del:hover { color: #b05050; }
    /* ── Advanced (hidden settings) ─────────────────────────────────── */
    .advanced-toggle {
      background: none;
      border: none;
      color: #3a3a3a;
      font-size: 0.62rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      padding: 6px 0;
      width: 100%;
      text-align: center;
      font-family: 'Palatino Linotype', Palatino, serif;
      transition: color 0.2s;
    }
    .advanced-toggle:hover { color: #777; }
    .deck-toggle { color: #9a9280; font-size: 0.8rem; }
    .deck-toggle:hover { color: #c8bfa8; }
    .advanced-section { display: none; }
    .advanced-section.open { display: block; }
    #deckSection.open { display: flex; flex-direction: column; gap: 16px; }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 240px;
      overflow-y: auto;
    }
    .history-entry {
      background: rgba(12,14,22,0.42);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 14px;
      padding: 9px 11px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .history-entry:hover {
      background: rgba(22,26,38,0.55);
      border-color: rgba(255,255,255,0.2);
    }
    .history-entry:active { background: rgba(8,10,16,0.5); }
    .history-entry-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .history-date {
      color: #9b9482;
      font-size: 0.65rem;
      letter-spacing: 0.8px;
    }
    .history-deck {
      color: #8d8674;
      font-size: 0.62rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .history-cards {
      color: #ded7c6;
      font-size: 0.78rem;
      line-height: 1.5;
    }
    .history-cards span {
      display: block;
    }
    .history-empty {
      color: #3a3a3a;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      text-align: center;
      padding: 10px 0;
    }

    /* ── AI Panel ──────────────────────────────────────────────── */
    .btn-ai {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 13px;
      line-height: 0;
    }
    .btn-ai svg { width: 22px; height: 22px; fill: #8a8578; transition: fill 0.2s; }
    .btn-ai:hover svg { fill: #888; }
    .btn-ai.active svg { fill: #c8a96e; }

    .ai-panel {
      position: fixed;
      bottom: 80px;
      left: 16px;
      right: 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 16px 18px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      z-index: 100;
      max-height: 72vh;
    }
    .ai-panel.open { display: flex; }

    .ai-key-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .ai-key-label {
      color: #555;
      font-family: 'Palatino Linotype', Palatino, serif;
      font-size: 0.65rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .ai-key-input {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #888;
      font-size: 0.75rem;
      padding: 7px 10px;
      font-family: monospace;
      width: 100%;
    }
    .ai-key-input:focus { outline: none; border-color: #444; color: #aaa; }

    .ai-question {
      background: #1a1a1a;

      color: #444;
      font-family: 'Palatino Linotype', Palatino, serif;

      animation: pulse 1.5s ease-in-out infinite;

    /* ── Short screens (phones): keep all three cards on screen ────── */
    @media (max-height: 900px) and (max-width: 759px) {
      body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
      .card-wrap { width: 140px; height: 240px; }
      .card-info { height: 240px; }

      .bicycle-mode .card-wrap { width: 152px; }
      .red-mode .card-wrap { width: 140px; }
    }

    /* ── Wide screens: cards side by side, text underneath ────────── */
    @media (min-width: 760px) {
      body { justify-content: center; }
      .spread {
        flex-direction: row;
        justify-content: center;
        align-items: flex-start;
        gap: 36px;
        max-width: 1100px;
      }
      .slot {
        flex-direction: column;
        align-items: center;
        gap: 14px;
        flex: 0 1 240px;
      }
      .card-info, .lenormand-mode .card-info {
        height: auto;
        max-height: 44vh;
        overflow-y: auto;
        align-items: center;
        text-align: center;
      }
      .card-label, .meaning-text { text-align: center; }
      .one-card .spread { justify-content: center; }

    /* ── Backdrop scrim (phone bottom sheet) ─────────────────────── */
    #scrim {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 99;
      display: none;

      color: #ff8070 !important;
      font-weight: bold;

    /* ── Phones: settings as a bottom sheet, bigger touch targets ──── */
    @media (max-width: 759px) {
      #scrim.open { display: block; }
      .settings-panel {
        bottom: 0; left: 0; right: 0;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        border: none;
        border-top: 1px solid rgba(255,255,255,0.16);
        border-radius: 28px 28px 0 0;
        padding: 10px 22px calc(24px + env(safe-area-inset-bottom));
        max-height: 84vh;
      }
      .settings-panel.open { animation: sheetUp 0.28s cubic-bezier(0.32, 0.72, 0.33, 1); }
      .sheet-handle { display: flex; }
      /* The Атласные deck draws from an SVG sprite calibrated for a 160px
         box — keep that exact width so cards don't shift sideways. */
      body.lenormand-mode:not(.russian-mode):not(.golden-mode):not(.bicycle-mode):not(.red-mode):not(.copag-mode) .card-wrap { width: 160px; }
      .history-list { max-height: 42vh; }
      .deck-btn { padding: 13px 10px; font-size: 0.82rem; }
      .count-btn { padding: 10px 18px; font-size: 0.9rem; }
      .history-entry { padding: 14px 15px; }
      .saved-name { font-size: 1.02rem; }
      .history-cards { font-size: 0.95rem; }
      .history-date, .history-deck { font-size: 0.74rem; }
      .saved-del, .history-clear-btn { font-size: 0.78rem; }
      .reshuffle-btn { padding: 11px 9px; font-size: 0.8rem; }
      .setting-label { font-size: 1.05rem; }
      .advanced-toggle { font-size: 0.72rem; padding: 10px 0; }
      /* sheet covers the floating controls while open */
      .settings-panel.open ~ .controls { opacity: 0; pointer-events: none; }
      /* no 3D card layers behind the sheet/gallery (kills compositor bleed) */
      body.sheet-open .spread { visibility: hidden; }
    }
    @keyframes sheetUp { from { transform: translateY(42px); opacity: 0.4; } }

    /* ── Deck gallery (view all cards) ───────────────────────────── */
    .view-btn { background: rgba(120,170,255,0.12); border-color: rgba(150,190,255,0.38); color: #b9d4ff; }
    .view-btn:hover { background: rgba(120,170,255,0.2); border-color: rgba(170,205,255,0.55); color: #d4e5ff; }
    .deck-gallery {
      position: fixed; inset: 0;
      background: rgba(10,12,18,0.82);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      backdrop-filter: blur(22px) saturate(140%);
      z-index: 300;
      display: none;
      flex-direction: column;
    }
    .deck-gallery.open { display: flex; }
    .gallery-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
      flex-shrink: 0;

      color: #c9a84c;

      background: none; border: none; color: #888;
      font-size: 1.6rem; line-height: 1;
      padding: 10px 12px; margin: -6px -8px;
      cursor: pointer;
    }
    .gallery-close:hover { color: #ddd; }
    .gallery-grid {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(106px, 1fr));
      gap: 14px 10px;
      padding: 6px 16px calc(28px + env(safe-area-inset-bottom));

    .g-cell { text-align: center; }

      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Toast ─────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(255,255,255,0.10);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.18);

      letter-spacing: 0.5px;

      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 200;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Lenormand card back — SVG sprite at col 13 (card back column) */
    .lenormand-mode .card-back {
      background: url('russian-deck.svg') -2273px -14px / 2447px 1030px no-repeat;
      box-shadow: none;
    }

    /* Tighter corners to match the SVG card's own rounding (rx≈30px → ~13.5px at display scale) */
    .lenormand-mode .card-back,
    .lenormand-mode .card-front.lenormand {
      border-radius: 14px;
    }

    /* Bicycle mode — standard playing cards (226×314 px images, ratio 0.720) */
    .bicycle-mode .card-wrap {
      width: 173px; /* matches image ratio: 226/314 × 240 ≈ 173 → cover clips nothing */
    }
    .bicycle-mode .card-back {
      background: url('bicycle-back.jpg') center / cover no-repeat;
      box-shadow: none;
    }
    .bicycle-mode .card-front {
      background: #fff;
    }
    .bicycle-mode .card-front img {
      object-fit: cover;
    }
    /* White overlay hides the thin black border that's baked into the card images */
    .bicycle-mode .card-front::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 3px solid #fff;
      border-radius: 7px;
      pointer-events: none;
    }

    /* Red mode — saulspatz SVG cards are 210×315 (ratio 0.667); 160×240 matches exactly */
    .red-mode .card-wrap {
      width: 160px;
    }
    .red-mode .card-back {
      background: url('bicycle-back-red.jpg?v=4') center / cover no-repeat;
      box-shadow: inset 0 0 0 8px #fff;
    }
    .red-mode .card-front {
      background: #fff;
    }
    .red-mode .card-front img {
      object-fit: cover;
    }
    .red-mode .card-front::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 3px solid #fff;
      border-radius: 7px;
      pointer-events: none;
    }

    /* Russian mode — 1911 Dondorf court/ace images + CSS pip cards */
    .russian-mode .card-back {
      background: url('russian-back.jpg') center / cover no-repeat;
      box-shadow: none;
    }
    .russian-mode .card-front {
      background: transparent;
      box-shadow: none;
    }
    .russian-mode .card-front img {
      object-fit: contain;
      border-radius: 4px;
    }
    /* Copag 4 Colour — rounded-corner cards (transparent corners) */
    .copag-mode .card-back {
      background: url('cp_back.png') center / contain no-repeat;
      box-shadow: none;
    }
    .copag-mode .card-front {
      background: transparent;
      box-shadow: none;
    }
    .copag-mode .card-front img {
      object-fit: contain;
    }

    /* Мадьяна (Modiano) — rounded-corner cards (transparent corners) */
    .madyana-mode .card-back {
      background: url('md_back.png') center / contain no-repeat;
      box-shadow: none;
    }
    .madyana-mode .card-front {
      background: transparent;
      box-shadow: none;
    }
    .madyana-mode .card-front img {
      object-fit: contain;
    }

    /* Golden Lenormand — rounded-corner cards (transparent corners) */
    .golden-mode .card-back {
      background: url('golden-back.png?v=5') center / contain no-repeat;
      box-shadow: none;
    }
    .golden-mode .card-front {
      background: transparent;
      box-shadow: none;
    }
    .golden-mode .card-front img {
      object-fit: contain;
    }
    .russian-pip {
      width: 100%; height: 100%;
      position: relative;
      font-family: 'Palatino Linotype', Palatino, serif;
    }
    .pip-tl, .pip-br {
      position: absolute;
      font-size: 0.72rem; font-weight: bold; line-height: 1.2; text-align: center;
    }
    .pip-tl { top: 6px; left: 3px; }
    .pip-br { bottom: 6px; right: 3px; transform: rotate(180deg); }
    .pip-sym {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 3.1rem; line-height: 1;
      user-select: none;
    }
    /* Double-headed court card */
    .pip-court-half {
      position: absolute;
      left: 0; right: 0; height: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px;
    }
    .pip-court-top { top: 0; }
    .pip-court-bot { bottom: 0; transform: rotate(180deg); }
    .pip-court-rank { font-size: 3.8rem; font-weight: bold; line-height: 1; }
    .pip-court-suit-mid { font-size: 2rem; line-height: 1; }
    .pip-court-divider {
      position: absolute; top: 50%; left: 12%; right: 12%;
      height: 1px; background: currentColor; opacity: 0.2;
      transform: translateY(-50%);
    }
    /* Ace */
    .pip-ace-sym {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 6rem; line-height: 1; user-select: none;
    }
  </style>
</head>

const MEANINGS = {

const SVG_CARD_W = 359, SVG_CARD_H = 539;
const SVG_TOTAL_W = 5490, SVG_TOTAL_H = 2310;
const DISPLAY_W = 160;
const SCALE = DISPLAY_W / SVG_CARD_W;           // 0.4457
const BG_W = Math.round(SVG_TOTAL_W * SCALE);   // 2447
const BG_H = Math.round(SVG_TOTAL_H * SCALE);   // 1030

// Column x-positions in the SVG
const COL_X = [30.5,420.5,810.5,1200.5,1590.5,1980.5,2370.5,2760.5,3150.5,3540.5,3930.5,4320.5,4710.5,5100.5];
// Row y-positions: ♥ ♦ ♣ ♠
const ROW_Y = [30.5, 600.5, 1170.5, 1740.5];
// Rank → column index (A=0, 2=1..5=4, 6=5..K=12, back=13)
const RANK_COL = { A:0, 6:5, 7:6, 8:7, 9:8, 10:9, J:10, Q:11, K:12 };
// Suit → row index
const SUIT_ROW = { '♥':0, '♦':1, '♣':2, '♠':3 };

function spriteStyle(suit, rank) {
  const col = RANK_COL[rank];
  const row = SUIT_ROW[suit];
  const bx = -Math.round(COL_X[col] * SCALE);
  const by = -Math.round(ROW_Y[row] * SCALE);
  return `background:url('russian-deck.svg') ${bx}px ${by}px / ${BG_W}px ${BG_H}px`;
}

function deckSource(name) {
  if (name === 'tarot' || name === 'marseille') return TAROT;
  return LENORMAND; // bicycle/red/copag readings use the 36-card pool; COPAG52 is gallery-only
}

// Fisher–Yates: uniform, unbiased shuffle (sort(()=>random-0.5) is not)
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickCards(name, count) {
  const source = deckSource(name);
  if (!deckRemaining[name] || deckRemaining[name].length < count) {
    deckRemaining[name] = shuffle(source);
  }
  const picked = deckRemaining[name].splice(0, count);
  updateDeckCount();
  return picked;
}

function reshuffleAll() {
  Object.keys(deckRemaining).forEach(k => { deckRemaining[k] = null; });
  updateDeckCount();
  resetCards();
}

function updateDeckCount() {
  const el = document.getElementById('deckCount');
  if (!el) return;
  const source = deckSource(currentDeck);
  const rem = deckRemaining[currentDeck] ? deckRemaining[currentDeck].length : source.length;
  el.textContent = rem + ' of ' + source.length + ' cards remaining';
}

function draw() {
  hasDrawn = true;
  meaningsVisible = false;
  closeSettings();
  for (let i = 0; i < 3; i++) {
    document.getElementById(`ci${i}`).classList.remove('flipped');
    document.getElementById(`lbl${i}`).textContent = '';
    const mn = document.getElementById(`mn${i}`);
    mn.textContent = '';
    mn.classList.remove('visible');
    flipped[i] = false;
  }
  if (currentDeck === 'lenormand') drawLenormand();
  else if (currentDeck === 'russian') drawRussian();
  else if (currentDeck === 'golden') drawGolden();
  else if (currentDeck === 'copag') drawCopag();
  else if (currentDeck === 'madyana') drawMadyana();
  else if (currentDeck === 'bicycle') drawBicycle();
  else if (currentDeck === 'red') drawRed();
  else if (currentDeck === 'marseille') drawMarseille();
  else drawTarot();
  setTimeout(saveToHistory, 1500);
}

function resetCards() {
  hasDrawn = false;
  meaningsVisible = false;
  for (let i = 0; i < 3; i++) {
    document.getElementById(`ci${i}`).classList.remove('flipped');
    document.getElementById(`lbl${i}`).textContent = '';
    const mn = document.getElementById(`mn${i}`);
    mn.textContent = '';
    mn.classList.remove('visible');
    flipped[i] = false;
  }
  updateDeckCount();
}

// Stagger the card reveals: flip(0)@300ms, flip(1)@550ms, flip(2)@800ms
function scheduleFlips(n) {
  for (let i = 0; i < n; i++) setTimeout(() => flip(i), 300 + i * 250);
}

function setCardCount(n) {
  cardCount = n;
  localStorage.setItem('cardCount', n);
  document.body.classList.toggle('one-card', n === 1);
  document.getElementById('cnt1').classList.toggle('active', n === 1);
  document.getElementById('cnt3').classList.toggle('active', n === 3);
  resetCards();
}

function drawTarot() {
  const allowRev = !document.getElementById('revToggle').checked;
  const shuffled = pickCards('tarot', cardCount);
  shuffled.forEach((img, i) => {
    const front = document.getElementById(`cf${i}`);
    front.className = 'card-front';
    front.style.cssText = '';
    const el = document.getElementById(`img${i}`);
    el.style.display = '';
    el.src = WIKI + img;
    front.innerHTML = '';
    front.appendChild(el);
    front.dataset.key = img.replace('.jpg', '');
    const rev = !allowRev && Math.random() < 0.3;
    if (rev) front.classList.add('rev');
  });
  scheduleFlips(shuffled.length);
}

function drawMarseille() {
  const allowRev = !document.getElementById('revToggle').checked;
  const shuffled = pickCards('marseille', cardCount);
  shuffled.forEach((img, i) => {

}

function drawRussian() {
  const shuffled = pickCards('russian', cardCount);
  drawnLenormand = shuffled;
  shuffled.forEach((card, i) => {
    const front = document.getElementById(`cf${i}`);
    front.className = 'card-front';
    front.style.cssText = '';
    front.dataset.name = card.name;
    front.dataset.suit = card.suit;
    front.dataset.rank = card.rank;
    const cardKey = String(card.rank) + card.suit;
    const localFile = RUSSIAN_LOCAL[cardKey];
    if (localFile) {
      front.innerHTML = '';
      const el = document.createElement('img');
      el.id = `img${i}`; el.alt = '';
      el.src = localFile + '?v=precise2';
      front.appendChild(el);
    } else {
      const color = (card.suit === '♥' || card.suit === '♦') ? '#b01020' : '#111';
      const corners = `<span class="pip-tl" style="color:${color}">${card.rank}<br>${card.suit}</span><span class="pip-br" style="color:${color}">${card.rank}<br>${card.suit}</span>`;
      const pipPos = {
        6:  [[18,30],[18,70],[50,30],[50,70],[82,30],[82,70]],
        7:  [[13,30],[13,70],[35,50],[57,30],[57,70],[80,30],[80,70]],
        8:  [[13,30],[13,70],[38,30],[38,70],[62,30],[62,70],[87,30],[87,70]],
        9:  [[11,30],[11,70],[30,30],[30,70],[50,50],[70,30],[70,70],[89,30],[89,70]],
        10: [[10,30],[10,70],[27,30],[27,70],[43,50],[57,50],[73,30],[73,70],[90,30],[90,70]],
      };
      const positions = pipPos[card.rank] || [];
      const pips = positions.map(([y, x]) => {
        const rot = y > 50 ? 'translate(-50%,-50%) rotate(180deg)' : 'translate(-50%,-50%)';
        return `<span class="pip-sym" style="top:${y}%;left:${x}%;color:${color};transform:${rot}">${card.suit}</span>`;
      }).join('');
      front.innerHTML = `<div class="russian-pip">${corners}${pips}</div>`;
    }
  });
  scheduleFlips(shuffled.length);

// ── Flip ───────────────────────────────────────────────────────────────────
// Decks that map to the 36 playing cards and offer the Lenormand/Гадание toggle.
function usesMeaningToggle() {
  return currentDeck === 'russian' || currentDeck === 'golden' ||
         currentDeck === 'lenormand' || currentDeck === 'bicycle' ||
         currentDeck === 'red' || currentDeck === 'copag' || currentDeck === 'madyana';
}

function flip(i) {
  document.getElementById(`ci${i}`).classList.add('flipped');
  flipped[i] = true;
  if (navigator.vibrate) navigator.vibrate(8); // subtle tactile tick on reveal
  setTimeout(() => {
    const front = document.getElementById(`cf${i}`);
    const rankSuitLbl = () => {
      const r = front.dataset.rank, su = front.dataset.suit;
      return `${BIKE_RANK_NAME[r] || r} of ${BIKE_SUIT_NAME[su] || su}`;
    };
    if (usesMeaningToggle() && meaningSystem === 'russian') {
      const rs = (front.dataset.rank || '') + (front.dataset.suit || '');
      const d = RUSDATA[rs];
      document.getElementById(`lbl${i}`).textContent = d ? d[0] : rankSuitLbl();
    } else if (usesMeaningToggle()) {
      const name = front.dataset.name || '';
      const icon = LEN_ICON[name] || '';
      document.getElementById(`lbl${i}`).textContent = name ? `${icon} ${name}`.trim() : rankSuitLbl();
    } else {
      const key = front.dataset.key;
      const firstLine = (MEANINGS[key] || '').split('\n')[0];
      const isRev = front.classList.contains('rev');
      document.getElementById(`lbl${i}`).textContent = isRev ? firstLine + ' (Rev.)' : firstLine;
    }
  }, 360);
}

function lenMeaning(i) {
  if (!drawnLenormand[i]) return '';
  const name = drawnLenormand[i].name;
  const d = LENDATA[name];
  if (!d) return name;
  let text = d[0];
  const sep = '\n\n·  ·  ·\n';
  if (i === 0 && drawnLenormand[1]) {
    const nb = drawnLenormand[1].name;
    const db = LENDATA[nb];
    if (db) text += `${sep}${name} + ${nb}\n${d[1]} ${db[2]}`;
  } else if (i === 2 && drawnLenormand[1]) {
    const na = drawnLenormand[1].name;
    const da = LENDATA[na];
    if (da) text += `${sep}${na} + ${name}\n${da[1]} ${d[2]}`;
  } else if (i === 1 && drawnLenormand[0] && drawnLenormand[2]) {
    const na = drawnLenormand[0].name;
    const nc = drawnLenormand[2].name;
    const da = LENDATA[na];
    const dc = LENDATA[nc];
    if (da && dc) {
      text += `${sep}${na} · ${name} · ${nc}\n${da[1]} → ${d[1]} → ${dc[1]}`;
    }
  }
  return text;
}

function rusMeaning(i) {
  const front = document.getElementById(`cf${i}`);
  if (!front) return '';
  const rs = (front.dataset.rank || '') + (front.dataset.suit || '');
  const d = RUSDATA[rs];
  // Title is already shown as the card label above — return only the meaning text.
  return d ? d[1] : '';
}

// Long-press on any card = copy the reading (replaces the copy button)
let lpFired = false;
(function initLongPressCopy() {
  document.querySelectorAll('.card-wrap').forEach(wp => {
    let t = null, sx = 0, sy = 0;
    wp.addEventListener('pointerdown', e => {
      sx = e.clientX; sy = e.clientY; lpFired = false;
      clearTimeout(t);
      t = setTimeout(() => {
        lpFired = true;
        copyCards();
        if (navigator.vibrate) navigator.vibrate(12);
      }, 550);
    });
    const cancel = () => clearTimeout(t);
    wp.addEventListener('pointerup', cancel);
    wp.addEventListener('pointercancel', cancel);
    wp.addEventListener('pointerleave', cancel);
    wp.addEventListener('pointermove', e => {
      if (Math.abs(e.clientX - sx) > 12 || Math.abs(e.clientY - sy) > 12) clearTimeout(t);
    });
  });
})();

function tap(i) {
  if (lpFired) { lpFired = false; return; }   // the long-press already acted
  const now = Date.now();
  const gap = now - lastTap;
  lastTap = now;

  if (gap < 300 && gap > 0) {
    clearTimeout(tapTimer);
    draw();
    return;
  }

  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => {
    if (!hasDrawn) {
      draw();
      return;
    }
    if (!flipped[i]) {
      flip(i);
      return;
    }
    toggleAllMeanings();
  }, 300);
}

function getMeaning(i) {
  const front = document.getElementById(`cf${i}`);
  const key = front.dataset.key;
  const upright = MEANINGS[key] || '';
  const body = upright.split('\n').slice(1).join('\n');
  if (!front.classList.contains('rev') || !REVERSED[key]) return body;
  return REVERSED[key];
}

function toggleAllMeanings() {
  meaningsVisible = !meaningsVisible;
  for (let i = 0; i < 3; i++) {
    const mn = document.getElementById(`mn${i}`);
    if (meaningsVisible && flipped[i]) {
      const text = (usesMeaningToggle() && meaningSystem === 'russian') ? rusMeaning(i)
                 : usesMeaningToggle() ? lenMeaning(i)
                 : getMeaning(i);
      if (text) { mn.textContent = text; mn.classList.add('visible'); }
    } else {
      mn.classList.remove('visible');
      mn.textContent = '';
    }
  }
}


// Two-tap confirmation for destructive buttons: first tap arms ("Sure?"),
// second tap within 2.6s executes; otherwise it reverts.
function confirmTap(btn, ev, fn) {
  if (ev) ev.stopPropagation();
  if (btn.dataset.armed) {
    clearTimeout(btn._confirmT);
    delete btn.dataset.armed;
    btn.classList.remove('armed');
    btn.textContent = btn.dataset.orig;
    fn();
    return;
  }
  btn.dataset.armed = '1';
  btn.dataset.orig = btn.textContent;
  btn.textContent = 'Sure?';
  btn.classList.add('armed');
  btn._confirmT = setTimeout(() => {
    delete btn.dataset.armed;
    btn.classList.remove('armed');
    btn.textContent = btn.dataset.orig;
  }, 2600);
}

const AI_KEY_LS = 'tarot_ak';


function getCardsForReading() {
  const lines = [];
  for (let i = 0; i < 3; i++) {
    const front = document.getElementById(`cf${i}`);
    if (!front) continue;
    const lbl   = document.getElementById(`lbl${i}`).textContent.trim();
    const isRev = front.classList.contains('rev');
    if (lbl) {
      lines.push(`Card ${i + 1}: ${lbl}${isRev ? ' (Reversed)' : ''}`);
    } else if (front.dataset.rank) {
      lines.push(`Card ${i + 1}: ${front.dataset.rank}${front.dataset.suit}`);
    } else if (front.dataset.key) {
      const first = (MEANINGS[front.dataset.key] || front.dataset.key).split('\n')[0];
      lines.push(`Card ${i + 1}: ${first}${isRev ? ' (Reversed)' : ''}`);
    }
  }
  return lines;
}

async function askClaude() {
  const keyInput = document.getElementById('aiKeyInput');
  let apiKey = keyInput.value.trim() || localStorage.getItem(AI_KEY_LS) || '';
  if (!apiKey) {
    keyInput.focus();
    return;
  }
  localStorage.setItem(AI_KEY_LS, apiKey);

  const question = document.getElementById('aiQuestion').value.trim();
  const cards    = getCardsForReading();

  const sendBtn  = document.getElementById('aiSendBtn');
  const loading  = document.getElementById('aiLoading');
  const response = document.getElementById('aiResponse');

  sendBtn.disabled = true;
  loading.classList.add('visible');
  response.classList.remove('visible');
  response.textContent = '';

  const deckName  = currentDeck.charAt(0).toUpperCase() + currentDeck.slice(1);
  const cardBlock = cards.length ? cards.join('\n') : '(no cards drawn yet)';
  const userMsg   = question
    ? `My question: ${question}\n\nDeck: ${deckName}\n${cardBlock}`
    : `Deck: ${deckName}\n${cardBlock}\n\nPlease give me a reading.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-5',
        max_tokens: 700,
        stream: true,
        system: 'You are an insightful card reader. Interpret the spread in relation to the question, following the tradition of the deck in use (Tarot, Lenormand, or Russian playing-card fortune-telling). Be direct, poetic, and grounded. Weave the cards together into a unified reading — do not list them separately. Reply in the same language as the question (default to Russian if there is no question). Keep it under 180 words.',
        messages: [{ role: 'user', content: userMsg }],
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    loading.classList.remove('visible');
    response.classList.add('visible');

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;
        try {
          const parsed = JSON.parse(data);
          if (parsed.type === 'content_block_delta' && parsed.delta?.text) {
            response.textContent += parsed.delta.text;
            response.scrollTop = response.scrollHeight;
          }
        } catch {}
      }
    }
  } catch (err) {
    loading.classList.remove('visible');
    response.textContent = '⚠ ' + err.message;
    response.classList.add('visible');
    if (/auth|key|401/i.test(err.message)) {
      localStorage.removeItem(AI_KEY_LS);
      document.getElementById('aiKeyInput').value = '';
      document.getElementById('aiKeyInput').focus();
    }
  } finally {
    sendBtn.disabled = false;
  }
}

const HISTORY_KEY = 'readingHistory';
const HISTORY_MAX = 30;

const DECK_LABEL = {
  tarot:'Tarot', marseille:'Marseille', lenormand:'Атласные',
  russian:'Russian', bicycle:'Bicycle', red:'Bicycle Jumbo',
  golden:'Golden', copag:'Copag 4 Colour', madyana:'Modiano'
};

// Capture the full render state of the current spread so it can be replayed.
function captureSpread() {
  const cards = [0,1,2].map(i => document.getElementById(`lbl${i}`).textContent).filter(Boolean);
  if (cards.length < cardCount) return null;
  const slots = [];
  for (let i = 0; i < cardCount; i++) {
    const front = document.getElementById(`cf${i}`);
    if (!front) continue;
    const img = document.getElementById(`img${i}`);
    slots.push({
      key: front.dataset.key || '',
      name: front.dataset.name || '',
      suit: front.dataset.suit || '',
      rank: front.dataset.rank || '',
      src: img ? img.getAttribute('src') : '',
      style: front.getAttribute('style') || '',
      cls: front.className,
      rev: front.classList.contains('rev'),
    });
  }
  return { ts: Date.now(), deck: currentDeck, count: cardCount, cards, slots };
}

function saveToHistory() {
  const entry = captureSpread();
  if (!entry) return;
  const list = loadHistory();
  list.unshift(entry);
  if (list.length > HISTORY_MAX) list.length = HISTORY_MAX;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
}

function deleteHistory(idx) {
  const list = loadHistory();
  list.splice(idx, 1);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  renderHistory();
}

// Row removal animation: slide out, then collapse the row's height.
function animateRemove(wrap, entry, done) {
  entry.style.transition = 'transform 0.2s ease-in';
  entry.style.transform = 'translateX(-110%)';
  wrap.style.height = wrap.offsetHeight + 'px';
  wrap.style.transition = 'height 0.24s ease 0.08s, opacity 0.24s ease 0.08s';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    wrap.style.height = '0px';
    wrap.style.opacity = '0';
  }));
  setTimeout(done, 360);
}

// iOS-style swipe-to-delete: drag left reveals Delete; a long swipe deletes.
function attachSwipe(listId, delFn) {
  document.querySelectorAll('#' + listId + ' .swipe-wrap').forEach(wrap => {
    const entry = wrap.querySelector('.history-entry');
    if (!entry) return;
    const idx = parseInt(entry.dataset.idx, 10);
    const delBtn = wrap.querySelector('.swipe-del');
    if (delBtn) delBtn.addEventListener('click', e => {
      e.stopPropagation();
      animateRemove(wrap, entry, () => delFn(idx));
    });
    const OPEN_X = -88;
    let startX = 0, startY = 0, dx = 0, dragging = false, horiz = null, open = false, swiped = false;

    entry.addEventListener('pointerdown', e => {
      startX = e.clientX; startY = e.clientY;
      dragging = true; horiz = null; swiped = false;
      entry.style.transition = 'none';
    });
    entry.addEventListener('pointermove', e => {
      if (!dragging) return;
      const mx = e.clientX - startX, my = e.clientY - startY;
      if (horiz === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) horiz = Math.abs(mx) > Math.abs(my);
      if (!horiz) return;
      wrap.classList.add('reveal');
      try { entry.setPointerCapture(e.pointerId); } catch {}
      dx = Math.min(0, Math.max(-150, (open ? OPEN_X : 0) + mx));
      entry.style.transform = `translateX(${dx}px)`;
      e.preventDefault();
    });
    const finish = () => {
      if (!dragging) return;
      dragging = false;
      entry.style.transition = 'transform 0.22s';
      if (horiz) {
        swiped = true;                  // eat the ghost click right after the drag…
        setTimeout(() => { swiped = false; }, 150);   // …but only that one
        if (dx < -130) {               // long swipe: delete straight away
          animateRemove(wrap, entry, () => delFn(idx));
          return;
        }
        open = dx < -48;
      }
      entry.style.transform = open ? `translateX(${OPEN_X}px)` : 'translateX(0)';
      if (!open) setTimeout(() => { if (!open) wrap.classList.remove('reveal'); }, 240);
    };
    entry.addEventListener('pointerup', finish);
    entry.addEventListener('pointercancel', finish);
    // a swipe (or an open row) must not trigger the replay click
    entry.addEventListener('click', e => {
      if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; return; }
      if (open) {                       // tap on an open row closes it
        e.stopPropagation(); e.preventDefault();
        open = false;
        entry.style.transform = 'translateX(0)';
        setTimeout(() => { if (!open) wrap.classList.remove('reveal'); }, 240);
      }
    }, true);
  });
}

function clearHistory() {
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
}

function renderHistory() {
  const list = loadHistory();
  const el = document.getElementById('historyList');
  if (!list.length) {
    el.innerHTML = '<div class="history-empty">No readings yet</div>';
    return;
  }
  el.innerHTML = list.map((e, idx) => {
    const d = new Date(e.ts);
    const dateStr = d.toLocaleDateString('en-GB', { day:'numeric', month:'short' })
                  + ' · ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    const deck = DECK_LABEL[e.deck] || e.deck;
    const cardLines = e.cards.map(c => `<span>${c}</span>`).join('');
    const replayable = Array.isArray(e.slots) && e.slots.length;
    return `<div class="swipe-wrap"><button class="swipe-del">Delete</button><div class="history-entry" data-idx="${idx}" ${replayable ? `onclick="openHistoryEntry(${idx})" title="Show this spread"` : ''}>
      <div class="history-entry-meta">
        <span class="history-date">${dateStr}</span>
        <span class="history-deck">${deck}</span>
      </div>
      <div class="history-cards">${cardLines}</div>
    </div></div>`;
  }).join('');
  attachSwipe('historyList', deleteHistory);
}

// Apply a captured spread (from history or saved) onto the table and flip it.
function applySpread(e) {
  if (!e || !Array.isArray(e.slots) || !e.slots.length) return;

  closeSettings();
  // Match the card-count layout the spread was drawn in.
  if (e.count && e.count !== cardCount) setCardCount(e.count);
  switchDeck(e.deck);          // sets currentDeck + body mode classes, runs resetCards()
  hasDrawn = true;
  meaningsVisible = false;
  // Rebuild drawnLenormand so per-card meanings work for sprite/Russian decks.
  drawnLenormand = e.slots.map(s => ({ name: s.name, suit: s.suit, rank: s.rank }));

  e.slots.forEach((s, i) => {
    const front = document.getElementById(`cf${i}`);
    if (!front) return;
    // Reset slot
    document.getElementById(`ci${i}`).classList.remove('flipped');
    const lbl = document.getElementById(`lbl${i}`); if (lbl) lbl.textContent = '';
    const mn = document.getElementById(`mn${i}`); if (mn) { mn.textContent = ''; mn.classList.remove('visible'); }
    flipped[i] = false;

    front.className = s.cls || 'card-front';
    front.setAttribute('style', s.style || '');
    if (s.key)  front.dataset.key  = s.key;  else delete front.dataset.key;
    if (s.name) front.dataset.name = s.name; else delete front.dataset.name;
    if (s.suit) front.dataset.suit = s.suit; else delete front.dataset.suit;
    if (s.rank) front.dataset.rank = s.rank; else delete front.dataset.rank;

    front.innerHTML = '';
    if (s.src) {
      const el = document.createElement('img');
      el.id = `img${i}`; el.alt = '';
      el.src = s.src;
      front.appendChild(el);
    } else if (front.classList.contains('russian-pip') || s.style.includes('russian-deck.svg')) {
      // sprite-based decks render purely via the style; nothing else needed
    }
  });

  scheduleFlips(e.slots.length);
}

// Replay a saved spread from history onto the table.
function openHistoryEntry(idx) {
  const e = loadHistory()[idx];
  if (!e) return;
  applySpread(e);
  showToast('Showing saved spread');
}

// ── Saved (named) readings ───────────────────────────────────────────────────
const SAVED_KEY = 'savedReadings';
const SAVED_MAX = 50;

function loadSaved() {
  try { return JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'); } catch { return []; }
}

function saveCurrentReading() {
  const entry = captureSpread();
  if (!entry) { showToast('Draw a reading first'); return; }
  const name = (prompt('Name this reading:', '') || '').trim();
  if (!name) return;
  entry.name = name;
  const list = loadSaved();
  list.unshift(entry);
  if (list.length > SAVED_MAX) list.length = SAVED_MAX;
  localStorage.setItem(SAVED_KEY, JSON.stringify(list));
  renderSaved();
  showToast('Reading saved');
}

function deleteSaved(idx, ev) {
  if (ev) ev.stopPropagation();
  const list = loadSaved();
  list.splice(idx, 1);
  localStorage.setItem(SAVED_KEY, JSON.stringify(list));
  renderSaved();
}

function clearSaved() {
  localStorage.removeItem(SAVED_KEY);
  renderSaved();
}

function openSavedEntry(idx) {
  const e = loadSaved()[idx];
  if (!e) return;
  applySpread(e);
  showToast('Showing: ' + (e.name || 'saved reading'));
}

function renderSaved() {
  const list = loadSaved();
  const el = document.getElementById('savedList');
  if (!el) return;
  if (!list.length) {
    el.innerHTML = '<div class="history-empty">No saved readings</div>';
    return;
  }
  el.innerHTML = list.map((e, idx) => {
    const d = new Date(e.ts);
    const dateStr = d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
    const deck = DECK_LABEL[e.deck] || e.deck;
    const cardLines = (e.cards || []).map(c => `<span>${c}</span>`).join('');
    const nm = (e.name || 'Untitled').replace(/</g, '&lt;');
    return `<div class="swipe-wrap"><button class="swipe-del">Delete</button><div class="history-entry" data-idx="${idx}" onclick="openSavedEntry(${idx})" title="Show this reading">
      <div class="history-entry-meta">
        <span class="saved-name">${nm}</span>
        <button class="saved-del" onclick="confirmTap(this, event, () => deleteSaved(${idx}, null))">Delete</button>
      </div>
      <div class="history-entry-meta">
        <span class="history-date">${dateStr}</span>
        <span class="history-deck">${deck}</span>
      </div>
      <div class="history-cards">${cardLines}</div>
    </div></div>`;
  }).join('');
  attachSwipe('savedList', i => deleteSaved(i, null));
}

// ── Deck gallery (view all cards) ───────────────────────────────────────────
function gallerySuitColor(suit) {
  if (currentDeck === 'copag')
    return {'♣':'#4caf50','♦':'#42a5f5','♥':'#ef5350','♠':'#e8e8e8'}[suit];
  return (suit === '♥' || suit === '♦') ? '#ef5350' : '#e8e8e8';
}

function galleryItems() {
  const items = [];
  if (currentDeck === 'tarot' || currentDeck === 'marseille') {
    for (const img of TAROT) {
      const key = img.replace('.jpg', '');
      const src = WIKI + (currentDeck === 'marseille' ? (MARSEILLE_MAP[key] || img) : img);
      items.push({ src, label: (MEANINGS[key] || key).split('\n')[0] });
    }
  } else if (currentDeck === 'russian' || currentDeck === 'golden' || currentDeck === 'lenormand') {
    for (const c of LENORMAND) {
      const rs = String(c.rank) + c.suit;
      const label = (meaningSystem === 'russian' && RUSDATA[rs])
        ? RUSDATA[rs][0]
        : `${LEN_ICON[c.name] || ''} ${c.name}`;
      if (currentDeck === 'russian') items.push({ src: RUSSIAN_LOCAL[rs], label });
      else if (currentDeck === 'golden') items.push({ src: `golden_${c.name}.png`, label });
      else items.push({ sprite: spriteStyle(c.suit, c.rank), label });
    }
  } else {
    // full 52-card view for bicycle / red / copag
    for (const c of COPAG52) {
      const label = `${c.rank}<span style="color:${gallerySuitColor(c.suit)}">${c.suit}</span>`;
      let src;
      if (currentDeck === 'bicycle') src = bikeUrl(c.rank, c.suit);
      else if (currentDeck === 'red') src = redUrl(c.rank, c.suit);
      else if (currentDeck === 'madyana') src = `md_${c.rank}${COPAG_SUIT_FILE[c.suit]}.png`;
      else src = `cp_${c.rank}${COPAG_SUIT_FILE[c.suit]}.png`;
      items.push({ src, label });
    }
  }
  return items;
}

function viewDeck() {
  closeSettings();
  const items = galleryItems();
  document.getElementById('galleryTitle').textContent =
    `${DECK_LABEL[currentDeck] || currentDeck} · ${items.length} cards`;
  document.getElementById('galleryGrid').innerHTML = items.map(it => {
    if (it.sprite)
      return `<div class="g-cell"><div class="g-spritewrap"><div class="g-sprite" style="${it.sprite}"></div></div><div class="g-lbl">${it.label}</div></div>`;
    return `<div class="g-cell"><img loading="lazy" src="${it.src}" alt=""><div class="g-lbl">${it.label}</div></div>`;
  }).join('');
  const g = document.getElementById('deckGallery');
  g.classList.add('open');
  document.body.classList.add('sheet-open');
  document.getElementById('galleryGrid').scrollTop = 0;
}

function closeGallery() {
  document.getElementById('deckGallery').classList.remove('open');
  document.body.classList.remove('sheet-open');
}

// ── Backup: export/import all data as a portable code ────────────────────────
const BACKUP_LIST_KEYS = { savedReadings: 50, readingHistory: 30 };
const BACKUP_VALUE_KEYS = ['cardCount', 'meaningSystem', AI_KEY_LS];

function exportData() {
  const data = { v: 1, t: Date.now() };
  for (const k of [...Object.keys(BACKUP_LIST_KEYS), ...BACKUP_VALUE_KEYS]) {
    const v = localStorage.getItem(k);
    if (v !== null) data[k] = v;
  }
  const code = 'TAROT1.' + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const fallback = () => prompt('Copy your backup code:', code);
  if (navigator.share) {
    navigator.share({ text: code }).then(() => showToast('Backup shared'))
      .catch(() => {
        if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => showToast('Backup copied')).catch(fallback);
        else fallback();
      });
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(() => showToast('Backup copied')).catch(fallback);
  } else fallback();
}

function importData() {
  const code = (prompt('Paste backup code:') || '').trim();
  if (!code) return;
  try {
    const raw = code.startsWith('TAROT1.') ? code.slice(7) : code;
    const data = JSON.parse(decodeURIComponent(escape(atob(raw))));
    // merge reading lists by timestamp (no data lost on either device)
    for (const [key, cap] of Object.entries(BACKUP_LIST_KEYS)) {
      if (data[key] === undefined) continue;
      let incoming = []; let cur = [];
      try { incoming = JSON.parse(data[key]) || []; } catch {}
      try { cur = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
      const seen = new Set(cur.map(e => e && e.ts));
      for (const e of incoming) if (e && !seen.has(e.ts)) cur.push(e);
      cur.sort((a, b) => (b.ts || 0) - (a.ts || 0));
      if (cur.length > cap) cur.length = cap;
      localStorage.setItem(key, JSON.stringify(cur));
    }
    for (const k of BACKUP_VALUE_KEYS)
      if (data[k] !== undefined) localStorage.setItem(k, data[k]);
    // apply imported settings live
    const cc = parseInt(localStorage.getItem('cardCount'), 10);
    if (cc === 1 || cc === 3) setCardCount(cc);
    meaningSystem = localStorage.getItem('meaningSystem') || meaningSystem;
    syncMeaningRow();
    renderSaved(); renderHistory();
    showToast('Backup imported');
  } catch (e) {
    showToast('Invalid backup code');
  }
}

// ── Saved / History tab switcher ─────────────────────────────────────────────
function setListTab(t) {
  localStorage.setItem('listTab', t);
  document.getElementById('tabSaved').classList.toggle('active', t === 'saved');
  document.getElementById('tabHistory').classList.toggle('active', t === 'history');
  document.getElementById('savedList').style.display = t === 'saved' ? '' : 'none';
  document.getElementById('historyList').style.display = t === 'history' ? '' : 'none';
}

// ── Settings ───────────────────────────────────────────────────────────────
// Pull the sheet down by its handle to dismiss (iOS sheet gesture)
(function initSheetDrag() {
  const handle = document.getElementById('sheetHandle');
  const panel = document.getElementById('settingsPanel');
  if (!handle || !panel) return;
  let startY = 0, dy = 0, dragging = false;
  handle.addEventListener('pointerdown', e => {
    dragging = true; startY = e.clientY; dy = 0;
    panel.style.transition = 'none';
    try { handle.setPointerCapture(e.pointerId); } catch {}
  });
  handle.addEventListener('pointermove', e => {
    if (!dragging) return;
    dy = Math.max(0, e.clientY - startY);
    panel.style.transform = `translate3d(0, ${dy}px, 0)`;
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = 'transform 0.22s ease';
    if (dy > 90) {
      panel.style.transform = 'translate3d(0, 105%, 0)';
      setTimeout(() => {
        closeSettings();
        panel.style.transition = ''; panel.style.transform = '';
      }, 230);
    } else {
      panel.style.transform = 'translate3d(0, 0, 0)';
      setTimeout(() => { panel.style.transition = ''; panel.style.transform = ''; }, 240);
    }
  };
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
})();

function closeSettings() {
  document.body.classList.remove('sheet-open');
  document.getElementById('settingsPanel').classList.remove('open');
  document.getElementById('btnSettings').classList.remove('active');
  document.getElementById('scrim').classList.remove('open');
}
function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  panel.classList.toggle('open');
  document.getElementById('btnSettings').classList.toggle('active');
  document.getElementById('scrim').classList.toggle('open', panel.classList.contains('open'));
  document.body.classList.toggle('sheet-open', panel.classList.contains('open'));
  if (panel.classList.contains('open')) {
    const saved = localStorage.getItem(AI_KEY_LS) || '';
    document.getElementById('aiKeyInput').value = saved;
    renderHistory();
    renderSaved();
    syncMeaningRow();
    // keep deck & advanced sections collapsed each time settings opens
    collapseDeckSection();
    collapseAdvanced();
  }
}
function syncDeckLabel() {
  const btn = document.getElementById('deckToggle');
  if (!btn) return;
  const open = document.getElementById('deckSection').classList.contains('open');
  btn.textContent = `Deck · ${DECK_LABEL[currentDeck] || currentDeck} ${open ? '▴' : '▾'}`;
}
function collapseDeckSection() {
  document.getElementById('deckSection').classList.remove('open');
  syncDeckLabel();
}
function toggleDeckSection() {
  document.getElementById('deckSection').classList.toggle('open');
  syncDeckLabel();
}

function collapseAdvanced() {
  document.getElementById('advancedSection').classList.remove('open');
  document.getElementById('advancedToggle').textContent = 'Advanced ▾';
}
function toggleAdvanced() {
  const sec = document.getElementById('advancedSection');
  const open = sec.classList.toggle('open');
  document.getElementById('advancedToggle').textContent = open ? 'Advanced ▴' : 'Advanced ▾';
}

// ── Deck switch ────────────────────────────────────────────────────────────
function switchDeck(deck) {
  currentDeck = deck;
  const isLen = deck === 'lenormand' || deck === 'russian' || deck === 'bicycle' || deck === 'red' || deck === 'golden';
  document.body.classList.toggle('lenormand-mode', isLen);
  document.body.classList.toggle('marseille-mode', deck === 'marseille');
  document.body.classList.toggle('russian-mode', deck === 'russian');
  document.body.classList.toggle('golden-mode', deck === 'golden');
  document.body.classList.toggle('copag-mode', deck === 'copag');
  document.body.classList.toggle('madyana-mode', deck === 'madyana');
  document.body.classList.toggle('bicycle-mode', deck === 'bicycle');
  document.body.classList.toggle('red-mode', deck === 'red');

  ['tarot', 'marseille', 'lenormand', 'russian', 'golden', 'bicycle', 'red', 'copag', 'madyana'].forEach(d => {
    const btn = document.getElementById('btn' + d.charAt(0).toUpperCase() + d.slice(1));
    if (btn) btn.classList.toggle('active', d === deck);
  });

  for (let i = 0; i < 3; i++) {
    const front = document.getElementById(`cf${i}`);
    if (!document.getElementById(`img${i}`)) {
      const img = document.createElement('img');
      img.id = `img${i}`; img.src = ''; img.alt = '';
      front.appendChild(img);
    }
  }
  resetCards();
  syncMeaningRow();
  syncDeckLabel();
}

// Show the Lenormand/Гадание toggle on all 36-card playing-card decks.
function syncMeaningRow() {
  const row = document.getElementById('meaningRow');
  if (!row) return;
  row.style.display = usesMeaningToggle() ? '' : 'none';
  const len = document.getElementById('msLen');
  const rus = document.getElementById('msRus');
  if (len) len.classList.toggle('active', meaningSystem === 'lenormand');
  if (rus) rus.classList.toggle('active', meaningSystem === 'russian');
}

function setMeaningSystem(sys) {
  meaningSystem = sys;
  localStorage.setItem('meaningSystem', sys);
  syncMeaningRow();
  // refresh labels/meanings for any already-flipped cards
  for (let i = 0; i < 3; i++) {
    if (!flipped[i]) continue;
    const front = document.getElementById(`cf${i}`);
    if (!front) continue;
    const rankSuitLbl = () => {
      const r = front.dataset.rank, su = front.dataset.suit;
      return `${BIKE_RANK_NAME[r] || r} of ${BIKE_SUIT_NAME[su] || su}`;
    };
    if (usesMeaningToggle() && meaningSystem === 'russian') {
      const rs = (front.dataset.rank || '') + (front.dataset.suit || '');
      const d = RUSDATA[rs];
      document.getElementById(`lbl${i}`).textContent = d ? d[0] : rankSuitLbl();
    } else {
      const name = front.dataset.name || '';
      const icon = LEN_ICON[name] || '';
      document.getElementById(`lbl${i}`).textContent = name ? `${icon} ${name}`.trim() : rankSuitLbl();
    }
  }
  // if meanings are currently shown, re-render them
  if (meaningsVisible) { meaningsVisible = false; toggleAllMeanings(); }
}

// ── Init ───────────────────────────────────────────────────────────────────
document.addEventListener('click', (e) => {
  const panel = document.getElementById('settingsPanel');
  const btn   = document.getElementById('btnSettings');
  if (panel.classList.contains('open') &&
      !panel.contains(e.target) && !btn.contains(e.target)) {
    closeSettings();
  }
});

syncDeckLabel();

// Restore last-used Saved/History tab
setListTab(localStorage.getItem('listTab') || 'saved');

// Restore saved card count (1 or 3)
const savedCount = parseInt(localStorage.getItem('cardCount'), 10);
if (savedCount === 1) setCardCount(1);

// ── Service worker: instant updates + offline ───────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ── Image fallback ───────────────────────────────────────────────────────
// If a remote card image fails (CDN down / offline), show rank+suit or name
// instead of a blank white card.
document.getElementById('spread').addEventListener('error', (e) => {
  const img = e.target;
  if (img.tagName !== 'IMG') return;
  const front = img.closest('.card-front');
  if (!front || front.querySelector('.card-fallback')) return;
  img.style.display = 'none';
  const suit = front.dataset.suit || '';
  const isRed = suit === '♥' || suit === '♦';
  const fb = document.createElement('div');
  fb.className = 'card-fallback' + (isRed ? ' red' : '');
  if (front.dataset.rank) {
    fb.innerHTML = `<span class="fb-rank">${front.dataset.rank}</span><span class="fb-suit">${suit}</span>`;
  } else {
    const key = front.dataset.key || '';
    const name = (MEANINGS[key] || key).split('\n')[0] || '?';
    fb.innerHTML = `<span class="fb-rank" style="font-size:1.1rem;text-align:center;padding:0 8px">${name}</span>`;
  }
  front.appendChild(fb);
}, true);

resetCards();
</script>
